name: Frontend

# Roda a cada push na main e a cada pull request,
# mas só quando algo do frontend (ou este arquivo) muda.
on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"

# O workflow só precisa ler o código.
permissions:
  contents: read

jobs:
  lint-and-build:
    name: Lint e build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar o Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build (inclui a checagem de tipos)
        run: npm run build
